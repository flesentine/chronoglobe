<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoGlobe Facts Inventory</title><style>:root{color-scheme:dark;--bg:#07111f;--card:#0e1d31;--line:#243a55;--text:#edf7ff;--muted:#9eb3c8;--accent:#65e9ff;--bad:#ff7b88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui}.wrap{max-width:1100px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.panel{margin:14px 0}.metric{font-size:30px;font-weight:800;color:var(--accent)}.muted{color:var(--muted)}.pass{color:var(--accent)}.fail{color:var(--bad)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}</style></head><body><main class="wrap"><h1>ChronoGlobe facts inventory</h1><p class="muted">Inspects the production canonical event model and its 600 active gameplay variants.</p><div id="summary" class="grid"></div><section class="panel"><h2>Release checks</h2><div id="checks"></div></section><section class="panel"><h2>Difficulty distribution</h2><div id="difficulty"></div></section><section class="panel"><h2>Expert editorial audit</h2><div id="expert"></div></section></main><script src="../facts/facts-core.js"></script><script src="../facts/seeds-1.js"></script><script src="../facts/seeds-2.js"></script><script src="../facts/seeds-3.js"></script><script src="../facts/seeds-4.js"></script><script src="../facts/expert-content.js"></script><script src="../facts/canonical-events.js"></script><script src="../facts/canonical-validation.js"></script><script src="../facts/facts-final.js"></script><script>(()=>{const events=window.CHRONO_CANONICAL_EVENTS||[],facts=window.CHRONO_FACTS||[],content=window.CHRONO_EXPERT_CONTENT||{},levels=['easy','medium','hard','expert'];const counts=Object.fromEntries(levels.map(level=>[level,facts.filter(f=>f.difficulty===level).length]));const reviewed=events.filter(e=>e.variants.expert.reviewed).length;const reused=events.filter(e=>e.variants.expert.fact===e.variants.hard.fact).length;const blankHints=events.filter(e=>!e.variants.expert.hint).length;const validCoordinates=events.filter(e=>Number.isFinite(e.lat)&&Number.isFinite(e.lng)&&e.lat>=-90&&e.lat<=90&&e.lng>=-180&&e.lng<=180).length;const checks=[['Canonical runtime active',window.CHRONO_RUNTIME_SOURCE==='canonical'],['150 canonical events',events.length===150],['600 runtime variants',facts.length===600],['150 reviewed Expert entries',reviewed===150],['One Expert content entry per event',Object.keys(content).length===150],['All coordinates valid',validCoordinates===150],['Expert clues differ from Hard',reused===0],['Expert hints are populated',blankHints===0],['Balanced difficulty counts',levels.every(level=>counts[level]===150)]];const report={runtimeSource:window.CHRONO_RUNTIME_SOURCE,eventCount:events.length,factCount:facts.length,expertContentCount:Object.keys(content).length,reviewedExperts:reviewed,reusedHardClues:reused,blankExpertHints:blankHints,validCoordinates,difficultyCounts:counts,passed:checks.filter(([,ok])=>ok).length,total:checks.length};window.CHRONO_INVENTORY_REPORT=report;summary.innerHTML=[['Events',events.length],['Runtime clues',facts.length],['Expert reviewed',reviewed],['Expert content',Object.keys(content).length],['Valid coordinates',`${validCoordinates}/150`],['Checks',`${report.passed}/${report.total}`]].map(([label,value])=>`<div class="card"><div class="metric">${value}</div><div class="muted">${label}</div></div>`).join('');document.getElementById('checks').innerHTML=checks.map(([label,ok])=>`<p class="${ok?'pass':'fail'}"><strong>${ok?'PASS':'FAIL'}:</strong> ${label}</p>`).join('');document.getElementById('difficulty').innerHTML=`<table><tbody>${levels.map(level=>`<tr><th>${level}</th><td>${counts[level]}</td></tr>`).join('')}</tbody></table>`;document.getElementById('expert').innerHTML=`<table><tbody><tr><th>Reviewed</th><td>${reviewed}</td></tr><tr><th>Dedicated content entries</th><td>${Object.keys(content).length}</td></tr><tr><th>Clues still matching Hard</th><td>${reused}</td></tr><tr><th>Blank hints</th><td>${blankHints}</td></tr><tr><th>Displayed category</th><td>Mystery</td></tr><tr><th>Displayed era</th><td>Hidden</td></tr></tbody></table>`})();</script></body></html>
