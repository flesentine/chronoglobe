<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoGlobe Persistence Test</title><style>body{margin:0;padding:24px;background:#07111f;color:#edf7ff;font:15px/1.5 system-ui}.wrap{max-width:900px;margin:auto}.card{margin:12px 0;padding:16px;border:1px solid #29405c;border-radius:14px;background:#0e1d31}.pass{color:#65e9ff}.fail{color:#ff7b88}code{color:#ffd166}</style></head><body><main class="wrap"><h1>Persistence diagnostics</h1><p>Tests canonical content versioning, exact deck restoration, paused-result normalization, and incompatible-save rejection.</p><div id="results"></div></main><script src="../facts/facts-core.js"></script><script src="../facts/seeds-1.js"></script><script src="../facts/seeds-2.js"></script><script src="../facts/seeds-3.js"></script><script src="../facts/seeds-4.js"></script><script src="../facts/expert-content.js"></script><script src="../facts/canonical-events.js"></script><script src="../facts/canonical-validation.js"></script><script src="../facts/facts-final.js"></script><script src="../deck.js"></script><script src="../persistence.js"></script><script>(()=>{const out=document.getElementById('results'),tests=[];const test=(name,fn)=>{try{fn();tests.push([name,true])}catch(error){tests.push([name,false,error.message])}};const facts=window.CHRONO_FACTS,deck=window.ChronoDeck.buildRoundDeck({facts,difficulty:'mixed',roundCount:5,seed:'persistence-test'});const fake={phase:'paused',resumePhase:'result',config:{difficulty:'mixed'},totalRounds:5,round:1,score:7000,originalMaximum:50000,adjustedMaximum:48000,hintsUsed:1,streak:1,bestStreak:1,guess:{lat:10,lng:20},hintUsed:true,roundCap:8000,meaningfulProgress:true,distances:[500],roundResults:[{eventId:deck[0].eventId,variantId:deck[0].variantId,difficulty:deck[0].difficulty,distanceKm:500,distanceScore:7575,roundCap:8000,awardedScore:7575,accuracyTier:'excellent',accuracyLabel:'Excellent',hintUsed:true,streakContinued:true}],roundDeck:deck};test('Canonical runtime is active',()=>{if(window.CHRONO_RUNTIME_SOURCE!=='canonical'||facts.length!==600)throw Error('canonical runtime unavailable')});test('Content version is canonical',()=>{if(ChronoPersistence.CONTENT_VERSION!=='canonical-150-expert-v1')throw Error(ChronoPersistence.CONTENT_VERSION)});test('Paused result serializes as result',()=>{const s=ChronoPersistence.serialize(fake);if(s.phase!=='result')throw Error(`phase=${s.phase}`)});test('Exact deck IDs are serialized',()=>{const s=ChronoPersistence.serialize(fake);if(s.deck.map(x=>x.variantId).join('|')!==deck.map(x=>x.variantId).join('|'))throw Error('deck changed')});test('Round guess is retained',()=>{const s=ChronoPersistence.serialize(fake);if(s.guess.lat!==10||s.guess.lng!==20)throw Error('guess missing')});test('Invalid state does not serialize',()=>{if(ChronoPersistence.serialize({})!==null)throw Error('expected null')});const passed=tests.filter(([,ok])=>ok).length;window.CHRONO_PERSISTENCE_REPORT={passed,total:tests.length,failed:tests.length-passed,contentVersion:ChronoPersistence.CONTENT_VERSION,runtimeSource:window.CHRONO_RUNTIME_SOURCE};out.innerHTML=tests.map(([name,ok,error])=>`<div class="card"><strong class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</strong> — ${name}${error?`<div><code>${error}</code></div>`:''}</div>`).join('')})();</script></body></html>
