<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoGlobe scoring test</title><style>body{margin:0;padding:28px;background:#07111f;color:#eef8ff;font:15px/1.5 system-ui}main{max-width:900px;margin:auto}table{width:100%;border-collapse:collapse;background:#0e1d31;border:1px solid #243a55;border-radius:14px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #243a55;text-align:left}.ok{color:#65e9ff}.bad{color:#ff7b88}code{color:#ffd166}</style></head><body><main><h1>Package D scoring diagnostics</h1><p id="summary"></p><table><thead><tr><th>Distance</th><th>Accuracy score</th><th>Tier</th><th>No hint</th><th>With hint</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></main><script src="../scoring.js"></script><script>(()=>{const tests=[0,.2,.5,1,100,500,1000,1250,2000,3000,5000,10000];let passed=0;const html=tests.map(km=>{const normal=ChronoScoring.roundResult(km,false),hint=ChronoScoring.roundResult(km,true);const ok=normal.roundCap===10000&&hint.roundCap===8000&&hint.awardedScore===Math.min(hint.distanceScore,8000)&&normal.streakContinued===(normal.distanceScore>=5000);if(ok)passed++;return `<tr><td>${km.toLocaleString()} km</td><td>${normal.distanceScore.toLocaleString()}</td><td>${normal.accuracyLabel}</td><td>${normal.awardedScore.toLocaleString()} / ${normal.roundCap.toLocaleString()}</td><td>${hint.awardedScore.toLocaleString()} / ${hint.roundCap.toLocaleString()}</td><td class="${ok?'ok':'bad'}">${ok?'PASS':'FAIL'}</td></tr>`}).join('');document.getElementById('rows').innerHTML=html;document.getElementById('summary').innerHTML=`<strong class="${passed===tests.length?'ok':'bad'}">${passed}/${tests.length} tests passed.</strong> Hint scores use a cap, not a flat deduction. Streaks use uncapped accuracy.`})()</script></body></html>
