<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoGlobe Replayability Test</title><style>body{margin:0;padding:28px;background:#07111f;color:#edf7ff;font:15px/1.5 system-ui}.wrap{max-width:900px;margin:auto}.card{padding:18px;margin:12px 0;border:1px solid #29415e;border-radius:14px;background:#0e1d31}.pass{color:#65e9ff}.fail{color:#ff7b88}</style></head><body><main class="wrap"><h1>Replayability diagnostics</h1><div id="results"></div></main><script src="../facts/facts-core.js"></script><script src="../facts/seeds-1.js"></script><script src="../facts/seeds-2.js"></script><script src="../facts/seeds-3.js"></script><script src="../facts/seeds-4.js"></script><script src="../facts/expert-content.js"></script><script src="../facts/canonical-events.js"></script><script src="../facts/canonical-validation.js"></script><script src="../facts/facts-final.js"></script><script src="../deck.js"></script><script src="../persistence.js"></script><script>const out=document.getElementById('results'),tests=[];const test=(name,fn)=>{try{const detail=fn();tests.push({name,ok:true,detail})}catch(e){tests.push({name,ok:false,detail:e.message})}};const version=ChronoPersistence.CONTENT_VERSION,date='2026-07-27',seed=`chronoglobe-daily-v1-${date}-${version}`;const build=s=>ChronoDeck.buildRoundDeck({facts:CHRONO_FACTS,difficulty:'mixed',roundCount:5,seed:s});test('Canonical runtime is active',()=>{if(CHRONO_RUNTIME_SOURCE!=='canonical'||CHRONO_FACTS.length!==600)throw Error('canonical runtime unavailable');return version});test('Daily deck is deterministic',()=>{const a=build(seed),b=build(seed);if(a.map(x=>x.variantId).join('|')!==b.map(x=>x.variantId).join('|'))throw Error('Decks differ');return a.map(x=>x.difficulty).join(' → ')});test('Daily deck contains five unique events',()=>{const d=build(seed);if(new Set(d.map(x=>x.eventId)).size!==5)throw Error('Repeated event');if(d[0].difficulty==='expert')throw Error('First round is Expert');return d.map(x=>x.eventId).join(', ')});test('Different UTC dates produce different decks',()=>{const a=build(seed),b=build(`chronoglobe-daily-v1-2026-07-28-${version}`);if(a.map(x=>x.variantId).join('|')===b.map(x=>x.variantId).join('|'))throw Error('Decks unexpectedly match');return 'Date seed changes selection'});const passed=tests.filter(t=>t.ok).length;window.CHRONO_REPLAYABILITY_REPORT={passed,total:tests.length,failed:tests.length-passed,contentVersion:version,seed};out.innerHTML=tests.map(t=>`<section class="card"><strong class="${t.ok?'pass':'fail'}">${t.ok?'PASS':'FAIL'} — ${t.name}</strong><div>${t.detail}</div></section>`).join('');</script></body></html>
