<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoGlobe Deck Test</title><style>:root{color-scheme:dark}body{margin:0;background:#07111f;color:#eef7ff;font:15px/1.5 system-ui;padding:28px}main{max-width:1000px;margin:auto}.panel{background:#0e1d31;border:1px solid #28405d;border-radius:16px;padding:18px;margin:14px 0}.pass{color:#65e9ff}.fail{color:#ff7b88}code{color:#ffd166}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #28405d}</style></head><body><main><h1>Round deck diagnostics</h1><p>Runs deterministic tests against the current 600 generated clues.</p><div id="results"></div></main><script src="../facts/facts-core.js"></script><script src="../facts/seeds-1.js"></script><script src="../facts/seeds-2.js"></script><script src="../facts/seeds-3.js"></script><script src="../facts/seeds-4.js"></script><script src="../facts/facts-final.js"></script><script src="../deck.js"></script><script>(()=>{const facts=window.CHRONO_FACTS||[];const tests=[];const add=(name,pass,detail='')=>tests.push({name,pass,detail});for(const difficulty of ['easy','medium','hard','expert'])for(const count of [5,10,15]){const deck=ChronoDeck.buildRoundDeck({facts,difficulty,roundCount:count,seed:`fixed-${difficulty}-${count}`});add(`${difficulty} ${count}: correct length`,deck.length===count,`found ${deck.length}`);add(`${difficulty} ${count}: unique events`,new Set(deck.map(x=>x.eventId)).size===count);add(`${difficulty} ${count}: correct difficulty`,deck.every(x=>x.difficulty===difficulty));const again=ChronoDeck.buildRoundDeck({facts,difficulty,roundCount:count,seed:`fixed-${difficulty}-${count}`});add(`${difficulty} ${count}: deterministic seed`,deck.map(x=>x.variantId).join('|')===again.map(x=>x.variantId).join('|'));}for(const count of [5,10,15]){const deck=ChronoDeck.buildRoundDeck({facts,difficulty:'mixed',roundCount:count,seed:`mixed-${count}`});const levels=deck.map(x=>x.difficulty);const expected=ChronoDeck.MIXED_COUNTS[count];const actual=levels.reduce((m,l)=>(m[l]=(m[l]||0)+1,m),{});add(`mixed ${count}: unique events`,new Set(deck.map(x=>x.eventId)).size===count);add(`mixed ${count}: exact distribution`,Object.keys(expected).every(k=>expected[k]===actual[k]),JSON.stringify(actual));add(`mixed ${count}: does not start Expert`,levels[0]!=='expert',levels.join(' → '));add(`mixed ${count}: no consecutive Expert`,!levels.some((l,i)=>i&&l==='expert'&&levels[i-1]==='expert'),levels.join(' → '));add(`mixed ${count}: max two same in a row`,!levels.some((l,i)=>i>1&&l===levels[i-1]&&l===levels[i-2]),levels.join(' → '));}const passed=tests.filter(t=>t.pass).length;document.getElementById('results').innerHTML=`<div class="panel"><strong class="${passed===tests.length?'pass':'fail'}">${passed} / ${tests.length} tests passed</strong></div><div class="panel"><table><thead><tr><th>Test</th><th>Status</th><th>Detail</th></tr></thead><tbody>${tests.map(t=>`<tr><td>${t.name}</td><td class="${t.pass?'pass':'fail'}">${t.pass?'PASS':'FAIL'}</td><td><code>${t.detail||''}</code></td></tr>`).join('')}</tbody></table></div>`;})();</script></body></html>
