name: Generate package lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-package-lock
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify locked Playwright version
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const pkg = require('./package.json');
          const expected = pkg.devDependencies['@playwright/test'];
          const locked = lock.packages?.['node_modules/@playwright/test']?.version;
          if (!locked || locked !== expected) {
            throw new Error(`Expected @playwright/test ${expected}; lockfile contains ${locked || 'nothing'}`);
          }
          console.log(`Locked @playwright/test ${locked}`);
          NODE

      - name: Commit package lock
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock release test dependencies'
          git push origin HEAD:main
