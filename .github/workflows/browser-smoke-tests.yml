name: Browser smoke tests
# Registered manually through GitHub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version
          python3 --version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare evidence directory
        run: mkdir -p test-results

      - name: Run release preflight
        id: preflight
        shell: bash
        run: |
          set -o pipefail
          npm run preflight 2>&1 | tee test-results/preflight.log

      - name: Discover browser tests
        id: discovery
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --list 2>&1 | tee test-results/discovery.log

      - name: Verify discovered coverage
        id: discovery_count
        run: node tools/verify-test-discovery.js test-results/discovery.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        id: browser
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee test-results/browser.log

      - name: Write release verification summary
        if: always()
        shell: bash
        run: |
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          playwright_version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          {
            echo '## ChronoGlobe release verification'
            echo
            echo '| Item | Value |'
            echo '| --- | --- |'
            printf '| Commit | `%s` |\n' "$GITHUB_SHA"
            printf '| Trigger | `%s` |\n' "$GITHUB_EVENT_NAME"
            printf '| Node | `%s` |\n' "$node_version"
            printf '| npm | `%s` |\n' "$npm_version"
            printf '| Playwright | `%s` |\n' "$playwright_version"
            echo '| Preflight | `${{ steps.preflight.outcome }}` |'
            echo '| Test discovery | `${{ steps.discovery.outcome }}` |'
            echo '| Discovered coverage | `${{ steps.discovery_count.outputs.summary || 'unavailable' }}` |'
            echo '| Browser tests | `${{ steps.browser.outcome }}` |'
            echo
            echo 'Full logs and the Playwright report are attached to this workflow run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
